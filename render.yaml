services:
  - type: web
    name: realnetra-deepfake-backend
    env: python
    buildCommand: "pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
      - key: TRANSFORMERS_NO_ADVISORY_WARNINGS
        value: "1"
