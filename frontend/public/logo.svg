<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Black Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#04070d" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Corner Reticle Brackets -->
  <path d="M 22 28 L 22 22 L 28 22" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 72 28 L 72 22 L 66 22" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 22 72 L 22 78 L 28 78" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 72 72 L 72 78 L 66 78" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cyan Face Profile Contour (Left Side) -->
  <path d="M 48 18 Q 38 20 32 30 Q 28 36 29 42 Q 31 46 29 50 C 27 54 30 58 31 62 Q 33 66 30 70 C 33 74 42 75 48 82" 
        fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" filter="url(#cyanGlow)" />
  
  <!-- Closed Eye Line -->
  <path d="M 34 43 Q 38 46 42 42" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />

  <!-- Vertical Green Laser Scan Beam -->
  <line x1="49.5" y1="17" x2="49.5" y2="83" stroke="#10b981" stroke-width="2.5" filter="url(#greenGlow)" />
  <circle cx="49.5" cy="17" r="1.5" fill="#ffffff" />
  <circle cx="49.5" cy="83" r="1.5" fill="#ffffff" />

  <!-- Digital Data Matrix Blocks (Right Side) -->
  <g fill="#10b981" opacity="0.85">
    <rect x="52" y="20" width="5" height="2.5" rx="0.5" />
    <rect x="59" y="20" width="3" height="2.5" rx="0.5" />
    <rect x="54" y="24" width="8" height="2.5" rx="0.5" />
    <rect x="64" y="24" width="4" height="2.5" rx="0.5" />
    <rect x="52" y="28" width="4" height="2.5" rx="0.5" stroke="#00f0ff" stroke-width="0.5" />
    <rect x="58" y="28" width="7" height="2.5" rx="0.5" />
    <rect x="67" y="28" width="3" height="2.5" rx="0.5" />
    <rect x="52" y="32" width="6" height="2.5" rx="0.5" />
    <rect x="60" y="32" width="5" height="2.5" rx="0.5" />
    <rect x="53" y="58" width="7" height="2.5" rx="0.5" />
    <rect x="62" y="58" width="5" height="2.5" rx="0.5" />
    <rect x="52" y="62" width="4" height="2.5" rx="0.5" />
    <rect x="58" y="62" width="8" height="2.5" rx="0.5" />
    <rect x="68" y="62" width="4" height="2.5" rx="0.5" />
    <rect x="54" y="66" width="9" height="2.5" rx="0.5" />
    <rect x="52" y="70" width="5" height="2.5" rx="0.5" />
    <rect x="59" y="70" width="4" height="2.5" rx="0.5" />
    <rect x="54" y="74" width="7" height="2.5" rx="0.5" />
  </g>

  <!-- Green Circular Checkmark Verification Badge -->
  <circle cx="58" cy="50" r="11" fill="#04070d" stroke="#10b981" stroke-width="2.5" filter="url(#greenGlow)" />
  <circle cx="58" cy="50" r="8.5" fill="none" stroke="#10b981" stroke-width="1.5" />
  <path d="M 53.5 50 L 56.5 53 L 63 46.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
